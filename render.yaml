services:
  - type: web
    name: cala-laiya-email-api
    runtime: node
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        value: aman@amanpulo.chat
      - key: PAYMENT_PROOF_DIR
        value: /var/data/payment-proofs
      - key: CONTACT_TO
        value: aman@amanpulo.chat
      - key: BOOKING_NOTIFY_TO
        value: aman@amanpulo.chat
      - key: ROOM_INVENTORY_JSON
        value: '{"garden-casita":2,"garden-casita-premier":2,"two-bedroom-casita":2,"three-bedroom-casita":2,"three-bedroom-premier":2,"luxury-pool-villa-3br":1,"luxury-pool-villa-4br":1,"luxury-pool-villa-5br":1}'
      - key: CORS_ORIGINS
        value: https://cala-laiya-resort.vercel.app
    disk:
      name: cala-laiya-receipts
      mountPath: /var/data
      sizeGB: 1
