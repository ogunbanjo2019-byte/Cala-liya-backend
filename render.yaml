services:
  - type: web
    name: cala-laiya-email-api
    runtime: node
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CONTACT_TO
        value: aman@amanpulo.chat
      - key: BOOKING_NOTIFY_TO
        value: aman@amanpulo.chat
      - key: CORS_ORIGINS
        value: https://cala-laiya-resort.vercel.app
